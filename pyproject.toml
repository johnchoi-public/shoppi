[project]
name = "shoppi"
version = "0.1.0"
description = "LLM calendar assistant: chat with an open-source model to manage calendar events."
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "cryptography>=42",
    # IANA timezone database for zoneinfo (not present on every system)
    "tzdata",
    # Google Calendar + OAuth (only imported by the Google provider modules)
    "google-api-python-client>=2.130",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    # LLM agent (provider-agnostic) and the local knowledge base
    "langchain>=1.4",
    "langgraph>=1.2",
    "langchain-ollama>=1.1",
    "langchain-chroma>=1.1",
    "langchain-text-splitters>=1.1",
    # Internal calendar storage
    "sqlalchemy>=2.0",
    # Web app
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.package-data]
# Ship the web UI's static files with the package.
"shoppi.web" = ["static/*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
